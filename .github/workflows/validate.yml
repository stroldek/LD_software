name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check src/worker.js
      - run: node --check src/telegram.js
      - run: node --check src/db.js
      - run: node --check src/http.js
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-dist
